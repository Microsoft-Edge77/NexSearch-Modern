
<script>
/* ===== v3 : actualités fiables + résultats web variés ===== */

// Configuration du Worker : déclarée avant toute utilisation
const NS_PX = (() => {
  try {
    return atob('aHR0cHM6Ly9wcm94eS1uZXhzZWFyY2guemFvLWdvdXJkZXQud29ya2Vycy5kZXY/dXJsPQ==');
  } catch (e) {
    return '';
  }
})();

const NS_WORKER = NS_PX
  .replace(/\?url=$/, '')
  .replace(/\/+$/, '');

S.px = ls('nex_px', NS_PX);

// Lecture des flux RSS
const parseRss = t => {
  const x = new DOMParser().parseFromString(t, 'text/xml');
  const g = (i, q) => i.querySelector(q)?.textContent || '';

  return [...x.querySelectorAll('item')].map(i => ({
    t: txt(g(i, 'title')),
    l: g(i, 'link'),
    d: txt(g(i, 'description')),
    p: g(i, 'pubDate')
  }));
};

// Chargement des flux avec plusieurs solutions de secours
async function feedItems(u) {
  const E = encodeURIComponent(u);
  const tries = [];

  if (S.px) {
    tries.push(async () =>
      parseRss(await (await fetch(S.px + E)).text())
    );
  }

  tries.push(async () => {
    const j = await jget(
      'https://api.rss2json.com/v1/api.json?rss_url=' + E
    );

    if (j.status !== 'ok') throw 0;

    return j.items.map(i => ({
      t: txt(i.title),
      l: i.link,
      d: txt(i.description),
      p: i.pubDate || ''
    }));
  });

  tries.push(() => rss(u));

  for (const f of tries) {
    try {
      const a = await f();
      if (a && a.length && a[0].t) return a;
    } catch (e) {}
  }

  throw 0;
}

// Sources d'actualités supplémentaires
async function gdelt() {
  const j = await jget(
    'https://api.gdeltproject.org/api/v2/doc/doc?query=' +
    encodeURIComponent('France sourcelang:french') +
    '&mode=artlist&maxrecords=200&format=json&sort=datedesc'
  );

  const m = {};

  (j.articles || []).forEach(a => {
    (m[a.domain] = m[a.domain] || []).push({
      t: a.title,
      l: a.url
    });
  });

  return Object.entries(m)
    .filter(([d, a]) => a.length >= 2)
    .sort((a, b) => b[1].length - a[1].length)
    .map(([d, a]) => [
      d.replace(/^www\./, ''),
      a.slice(0, 6)
    ]);
}

// Initialisation des tuiles d'actualités
async function initNews() {
  const g = $('#news-grid');
  let G = [];

  const r = await Promise.allSettled(
    FEEDS.map(async ([n, u]) => [
      n,
      (await feedItems(u)).slice(0, 6)
    ])
  );

  r.forEach(x => {
    if (x.status === 'fulfilled') G.push(x.value);
  });

  if (G.length < 10) {
    try {
      const have = G.map(x => x[0].toLowerCase());

      (await gdelt()).forEach(x => {
        if (
          G.length < 10 &&
          !have.some(h => x[0].includes(h.replace(/\s/g, '')))
        ) {
          G.push(x);
        }
      });
    } catch (e) {}
  }

  G.forEach(([n, N], k) => {
    let cur = 0;

    const t = document.createElement('div');
    t.className =
      'tile live turnstyle-tile ' + (k == 0 ? 'xwide' : 'wide');
    t.dataset.id = 'news' + k;

    t.innerHTML = `
      <div class="live-tile-inner">
        <div class="tile-face">
          <div class="tile-sub">${esc(n)}</div>
          <div class="tile-main">${esc(N[0].t)}</div>
        </div>
        <div class="tile-face back">
          <div class="tile-sub">${esc(n)}</div>
          <div class="tile-main">${esc((N[1] || N[0]).t)}</div>
        </div>
      </div>`;

    t.onclick = () => {
      if (
        !document.body.classList.contains('edit') &&
        /^https?:/.test(N[cur].l)
      ) {
        open(N[cur].l, '_blank', 'noopener');
      }
    };

    g.appendChild(t);
    addCtl(t);

    rotor(
      t,
      () => N.length,
      (f, i) => {
        cur = i;
        f.querySelector('.tile-main').textContent = N[i].t;
      },
      7000,
      11000
    );
  });

  if (!G.length) {
    g.innerHTML =
      '<div class="result-url">Actualités indisponibles : services gratuits injoignables. Essaie le réglage « Proxy CORS personnel ».</div>';
  }

  applyLayout();
}

// Recherche d'actualités
TABS['actualités'] = async (q, e, pg) => {
  let a;

  try {
    a = await feedItems(
      'https://www.bing.com/news/search?q=' +
      e +
      '&format=rss&setmkt=fr-FR&first=' +
      (pg * 10 + 1)
    );
  } catch (x) {
    if (pg) throw 0;
    a = await feedItems('https://www.francetvinfo.fr/titres.rss');
  }

  a = fresh(a);

  if (!a.length) throw 0;

  const h = a.slice(0, 15).map(nentry).join('');

  return pg
    ? h
    : '<div class="results-list" id="lst">' + h + '</div>';
};

// Recherche de sites officiels
async function official(q) {
  const j = await jget(
    'https://www.wikidata.org/w/api.php?action=wbsearchentities&format=json&origin=*&language=fr&uselang=fr&limit=4&search=' +
    encodeURIComponent(q)
  );

  const ids = j.search.map(x => x.id);

  if (!ids.length) return [];

  const e = await jget(
    'https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&origin=*&props=claims&ids=' +
    ids.join('|')
  );

  return j.search.map(x => {
    const c =
      e.entities[x.id]?.claims?.P856?.[0]?.mainsnak?.datavalue?.value;

    return c
      ? {
          t: x.label + ' — site officiel',
          l: c,
          d: x.description || 'Site officiel'
        }
      : null;
  }).filter(Boolean);
}

// Recherche Web
TABS.web = async (q, e, pg) => {
  const dom =
    !pg &&
    /^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}(\/\S*)?$/i.test(q.trim());

  const [b, o, w] = await Promise.allSettled([
    feedItems(
      'https://www.bing.com/search?q=' +
      e +
      '&format=rss&setmkt=fr-FR&first=' +
      (pg * 10 + 1)
    ),
    pg ? Promise.reject(0) : official(q),
    jget(
      'https://fr.wikipedia.org/w/api.php?action=query&list=search&srlimit=3&format=json&origin=*&sroffset=' +
      pg * 3 +
      '&srsearch=' +
      e
    )
  ]);

  let R = [];

  if (dom) {
    const u = /^https?:/i.test(q.trim())
      ? q.trim()
      : 'https://' + q.trim();

    R.push({
      t: host(u),
      l: u,
      d: 'Ouvrir ' + u
    });
  }

  if (o.status === 'fulfilled') {
    R = R.concat(o.value);
  }

  if (b.status === 'fulfilled') {
    R = R.concat(b.value);
  }

  if (w.status === 'fulfilled') {
    R = R.concat(
      w.value.query.search.map(r => ({
        t: r.title + ' — Wikipédia',
        l: 'https://fr.wikipedia.org/wiki/' +
          encodeURIComponent(r.title.replace(/ /g, '_')),
        d: txt(r.snippet)
      }))
    );
  }

  R = fresh(R);

  if (!R.length) throw 0;

  if (pg) return R.map(rentry).join('');

  S.R = R;

  const note = b.status === 'fulfilled'
    ? ''
    : '<div class="result-url" style="margin-top:12px">Les résultats Bing n\'ont pas pu être chargés (services gratuits bloqués). Réglages → « Proxy CORS personnel » pour les débloquer.</div>';

  return (
    (R.length > 3
      ? '<div class="res-tiles">' +
        R.slice(0, 3).map(rtile).join('') +
        '</div>'
      : '') +
    '<div class="results-list" id="lst">' +
    R.slice(R.length > 3 ? 3 : 0).map(rentry).join('') +
    '</div>' +
    note
  );
};

// Configuration du champ Proxy CORS
document.addEventListener('DOMContentLoaded', () => {
  const p = $('#px-in');
  p.value = S.px || NS_PX;

  p.onchange = e => {
    S.px = e.target.value.trim();
    lset('nex_px', S.px);
  };
});
</script>
