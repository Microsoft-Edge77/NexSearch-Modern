<style>
/* Le footer passe devant le fond (overlay z-index 0, main z-index 10) mais reste sous l’en-tête (100) et le panneau Paramètres (200). */
#footer-container{position:relative;z-index:50}

/* Barre du footer : effet Acrylic / verre flou, plus transparent */
#nexFooter{
    position:relative;
    z-index:1;
    display:block;
    width:100%;
    box-sizing:border-box;
    margin:0;
    padding:0 0 env(safe-area-inset-bottom,0px);
    color:#fff;
    border-top:2px solid var(--accent,#0078D7);

    background:
        linear-gradient(to right,rgba(255,255,255,0.04),rgba(255,255,255,0.01)),
        rgba(0,0,0,0.35);

    -webkit-backdrop-filter:blur(22px) saturate(160%);
    backdrop-filter:blur(22px) saturate(160%);

    box-shadow:0 -1px 24px rgba(0,0,0,0.14),inset 0 1px 0 rgba(255,255,255,0.05);

    opacity:1!important;
    visibility:visible!important;
    filter:none!important;
    transform:none!important;
}
#nexFooter .nxf-in{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    padding:18px 6%;
}
#nexFooter .nxf-brand{display:flex;align-items:center;gap:10px}
#nexFooter .nxf-logo{width:20px;height:20px;display:grid;grid-template-columns:1fr 1fr;gap:2px;flex:none}
#nexFooter .nxf-logo i{background:#fff}
#nexFooter .nxf-logo i:nth-child(2),
#nexFooter .nxf-logo i:nth-child(3){background:#888}
#nexFooter .nxf-name{font-family:"Segoe UI Light","Segoe UI",sans-serif;font-size:1.4rem;letter-spacing:-0.5px;text-transform:lowercase}
#nexFooter .nxf-name b{font-weight:700}
#nexFooter .nxf-privacy{
    color:#fff;
    text-decoration:none;
    font-size:.9rem;
    padding:8px 14px;
    background:rgba(255,255,255,0.1);
    transition:background-color .2s;
}
#nexFooter .nxf-privacy:hover{background:var(--accent,#0078D7)}
#nexFooter .nxf-copy{font-size:.8rem;color:#aaa}
@media (max-width:600px){
    #nexFooter .nxf-in{flex-direction:column;align-items:flex-start}
}
</style>

<footer id="nexFooter">
  <div class="nxf-in">
    <div class="nxf-brand">
      <span class="nxf-logo"><i></i><i></i><i></i><i></i></span>
      <span class="nxf-name">nex<b>search</b></span>
    </div>
    <a class="nxf-privacy" href="https://Microsoft-Edge77.github.io/NexSearch-Modern/confidential/">Déclaration de confidentialité</a>
    <div class="nxf-copy">© 2026 NexSearch</div>
  </div>
</footer>
